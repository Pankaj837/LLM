name: ci
on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch + this package, editable)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Packaging sanity check (src layout, editable install)
        run: python -m llm.train --help > /dev/null
      - name: Build the C++ tokenizer (native/tokenizer)
        run: |
          cmake -S native/tokenizer -B native/tokenizer/build
          cmake --build native/tokenizer/build
      - name: C++ tokenizer's own test suite
        run: ./native/tokenizer/build/test_tokenizer
      - name: Train a real vocabulary for the parity test
        run: ./native/tokenizer/build/prepare_dataset README.md ci_vocab.tok 500
      - name: Test suite (GPU tests skip themselves; C++ parity runs for real)
        env:
          TOK_CLI: native/tokenizer/build/encode_cli
          TOK_VOCAB: ci_vocab.tok
        run: python -m pytest -m "not gpu"
      - name: Team smoke script
        run: python scripts/smoke_test.py

  mutation-check:
    # slower (~3 min): proves the tests can fail. Runs on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest
      - run: python scripts/mutation_check.py

  # GPU job: enable on a self-hosted runner labelled "gpu" once one exists.
  # gpu-tests:
  #   runs-on: [self-hosted, gpu]
  #   steps:
  #     - uses: actions/checkout@v4
